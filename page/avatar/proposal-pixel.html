<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel taste proposal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #131314; color: #9aa0a6; font: 13px system-ui, sans-serif; }
  h2 { margin: 18px 0 10px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .tile { position: relative; border-radius: 16px; overflow: hidden; background: #1c1c1f; }
  .tile::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 50% 45%, var(--bg) 0%, transparent 62%); filter: blur(24px); opacity: .85; }
  .tile .av { position: absolute; inset: 3%; }
  .tile small { position: absolute; left: 10px; bottom: 8px; color: #e8eaed; font-size: 12px; text-shadow: 0 1px 2px #000; }
  .big .tile { width: 320px; height: 320px; }
  .mid .tile { width: 140px; height: 140px; }
  .mid .tile small, .tiny .tile small { font-size: 11px; left: 8px; bottom: 5px; }
  .tiny .tile { width: 96px; height: 96px; border-radius: 10px; }
  .tiny .tile small { display: none; }
  .freeze .tile *, .freeze .tile { animation-play-state: paused !important; }
  .freeze .tile[data-mood=speaking] * { animation-delay: -.083s !important; }
  .freeze .tile[data-mood=thinking] * { animation-delay: -1.2s !important; }
  .freeze .tile[data-mood=listening] * { animation-delay: -.3s !important; }
  .freeze .tile[data-mood=surprised] * { animation-delay: -.3s !important; }
  .freeze .tile[data-mood=idle] * { animation-delay: -1s !important; }
  .freeze .tile[data-mood=away] * { animation-delay: -2s !important; }
</style>
</head>
<body>
<h2>Chair (fox, bow tie) in six moods, 320px</h2>
<div class="row big" id="big"></div>
<h2>Other seeds, 140px</h2>
<div class="row mid" id="mid"></div>
<h2>All species at 96px</h2>
<div class="row tiny" id="tiny"></div>
<script type="module">
import { create, traitsOf } from './pixel.js';
const q = new URLSearchParams(location.search);
if (q.get('freeze')) document.body.classList.add('freeze');
const ALL = ['idle', 'speaking', 'thinking', 'listening', 'surprised', 'away'];
const SHOW = ['idle', 'speaking', 'thinking', 'surprised', 'away'];
const CHAIR = { seed: 'chair', look: { species: 'fox', color: '#f2a7a3', accessory: 'bowtie' } };
const MID = [
  { seed: 'guest-1', look: { species: 'cat' } }, { seed: 'guest-2', look: { species: 'bear', accessory: 'scarf' } },
  { seed: 'guest-4', look: { species: 'rabbit', accessory: 'ribbon' } }, { seed: 'guest-6', look: { species: 'owl', accessory: 'glasses' } },
  { seed: 'guest-0', look: { species: 'fox', accessory: 'hat' } },
];
const TINY = [
  { seed: 'a', look: { species: 'fox', accessory: 'bowtie' } }, { seed: 'b', look: { species: 'cat', accessory: 'bowtie' } },
  { seed: 'c', look: { species: 'bear', accessory: 'hat' } }, { seed: 'd', look: { species: 'rabbit', accessory: 'scarf' } },
  { seed: 'e', look: { species: 'owl', accessory: 'bowtie' } }, { seed: 'f', look: { species: 'cat', accessory: 'glasses' } },
  { seed: 'g' }, { seed: 'h' }, { seed: 'i' }, { seed: 'j' },
];
function tile(host, subject, mood, caption) {
  const a = create({ seed: subject.seed, look: subject.look || {}, label: subject.seed });
  a.setMood(mood);
  const t = document.createElement('div');
  t.className = 'tile';
  t.dataset.mood = mood;
  const tr = traitsOf(subject);
  t.style.setProperty('--bg', `hsl(${Math.round(tr.color.h)} 45% 32%)`);
  const box = document.createElement('div');
  box.className = 'av';
  box.appendChild(a.el);
  const c = document.createElement('small');
  c.textContent = caption || mood;
  t.append(box, c);
  host.appendChild(t);
}
for (const m of ALL) tile(document.getElementById('big'), CHAIR, m);
MID.forEach((s, i) => tile(document.getElementById('mid'), s, SHOW[i % SHOW.length], s.look.species + ' ' + SHOW[i % SHOW.length]));
for (const s of MID) for (const m of ['idle', 'speaking', 'thinking', 'surprised']) tile(document.getElementById('mid'), s, m, s.look.species + ' ' + m);
TINY.forEach((s, i) => tile(document.getElementById('tiny'), s, ALL[i % 6]));
</script>
</body>
</html>
