<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>geo proposal</title>
<style>
body{margin:0;padding:24px;background:#131314;color:#c4c7c5;font:13px system-ui,sans-serif}
h2{font-weight:500;margin:18px 0 10px}
.big{display:grid;grid-template-columns:repeat(3,330px);gap:14px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row b{width:90px;font-weight:500}
.tile{position:relative;overflow:hidden;border-radius:14px;background:#1f2023;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile::before{content:"";position:absolute;width:70%;height:70%;left:15%;top:15%;border-radius:50%;background:var(--tint);filter:blur(46px);opacity:.38}
.tile>*{position:relative}
.big .tile{height:340px}.small .tile{width:156px;height:156px}.mini .tile{width:112px;height:112px}
.av{width:var(--s);height:var(--s)}
.cap{position:absolute!important;left:10px;bottom:8px;font-size:12px;color:#fff}
.frozen .ge-root *{animation-delay:-.58s!important;animation-play-state:paused!important;transition:none!important}
</style></head><body>
<h2>Chair fox, 300px</h2><div class="big" id="big"></div>
<h2>Other seeds, 140px</h2><div class="small" id="small"></div>
<h2>96px</h2><div class="mini row" id="mini"></div>
<script type="module">
import { create, traitsOf } from './geo.js';
const q = new URLSearchParams(location.search);
if (q.get('freeze')) {
  document.body.classList.add('frozen');
  const t = parseFloat(q.get('freeze'));
  if (t > 1.5) document.head.insertAdjacentHTML('beforeend', '<style>.frozen .ge-root *{animation-delay:-' + t + 's!important}</style>');
}
function tile(parent, seed, look, mood, size, cap) {
  const t = traitsOf({ seed, look });
  const d = document.createElement('div'); d.className = 'tile'; d.style.setProperty('--tint', t.color.hex);
  const a = document.createElement('div'); a.className = 'av'; a.style.setProperty('--s', size + 'px');
  const av = create({ seed, look, label: seed }); a.appendChild(av.el); av.setMood(mood);
  const c = document.createElement('span'); c.className = 'cap'; c.textContent = cap;
  d.append(a, c); parent.appendChild(d);
}
const moods = ['idle','speaking','thinking','listening','surprised','away'];
for (const m of moods) tile(document.getElementById('big'), 'foxhound', {species:'fox',color:'#f2a7a3',accessory:'bowtie'}, m, 300, m);
const seeds = [['cat','Labs-01'],['bear','Labs-HQ'],['rabbit','root-01'],['owl','watchdog'],['fox','e5']];
for (const [sp, s] of seeds) {
  const row = document.createElement('div'); row.className='row'; row.innerHTML='<b>'+s+'</b>';
  const w = document.createElement('div'); w.style.cssText='display:flex;gap:10px';
  for (const m of moods) tile(w, s, {species: sp}, m, 140, m);
  row.appendChild(w); document.getElementById('small').appendChild(row);
}
const all = ['Labs-01','Labs-HQ','root-01','watchdog','e5','kennel','alpha','beta'];
all.forEach((s, i) => tile(document.getElementById('mini'), s, {}, moods[i % 6], 96, s));
</script></body></html>
